<div class="task-container">
  <div class="task-container__header">
    <mat-icon class="task-container__header-icon">checklist</mat-icon>
    <h1 class="task-container__header-title">Dashboard</h1>
    <div class="task-container__spacer"></div>
    <app-theme-toggle></app-theme-toggle>
  </div>

  <!-- Main Content Grid -->
  <div class="task-container__main-grid">
    <!-- Left Sidebar - Task Stats -->
    <aside class="task-container__sidebar" role="complementary">
      <app-task-stats [stats]="tasksStats()"></app-task-stats>
    </aside>

    <!-- Right Content - Main Features -->
    <main class="task-container__main-content" role="main">
      <div class="task-container__form-section">
        <div class="task-container__form">
          <div class="task-container__input-wrapper">
            <app-task-form [(taskText)]="newTaskText"></app-task-form>
          </div>
          <button mat-raised-button color="primary" (click)="addTask()" class="task-container__add-button">
            <mat-icon>add</mat-icon>
            Add Task
          </button>
        </div>
      </div>

      <app-task-filters [currentFilter]="currentFilter()" (onFilterChange)="onFilterChange($event)"></app-task-filters>

      <app-task-list [filteredTasks]="filteredTodos()" [editingTaskId]="editingTaskId()"
        (taskToggled)="onTaskToggle($event)" (taskDeleted)="deleteTask($event)"
        (taskEditStarted)="onTaskEditStarted($event)" (taskEditCanceled)="onTaskEditCanceled()"
        (taskEditSaved)="onTaskEditSaved($event)" (taskPriority)="onTaskPriorityChanged($event)" (tagAdded)="onTaskTagAdd($event.taskId, $event.tag)" (tagRemoved)="onTaskTagRemove($event.taskId, $event.tag)"></app-task-list>
    </main>
  </div>
</div>

<!-- Floating Components -->
<app-timer></app-timer>
<app-coffee-counter></app-coffee-counter>
<app-weather-chart chartType="bar" [data]="weatherData()"></app-weather-chart>
