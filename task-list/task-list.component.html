<div class="task-list">
  <div class="task-list__header">
    <mat-icon class="task-list__header-icon">checklist</mat-icon>
    <h1 class="task-list__header-title">Todo List</h1>
  </div>

  <mat-card class="task-list__add-section">
    <div class="task-list__add-form">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="task-list__input-wrapper">
        <mat-label>What needs to be done?</mat-label>
        <input matInput placeholder="Enter new task..." [(ngModel)]="newTaskText">
        <mat-icon matSuffix>edit</mat-icon>
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="addTask()" class="task-list__add-button">
        <mat-icon>add</mat-icon>
        Add Task
      </button>
    </div>
  </mat-card>

  <mat-card class="task-list__filters-section">
    <div class="task-list__filters">
      <h3 class="task-list__filters-title">Filters:</h3>
      <div class="task-list__filter-buttons">
        <button mat-button (click)="tasksListService.changeFilter('all')" class="task-list__filter-button"
          [class.task-list__filter-button--active]="tasksListService.filter() === 'all'">
          <mat-icon class="task-list__filter-icon">list</mat-icon>
          All
        </button>
        <button mat-button (click)="tasksListService.changeFilter('active')" class="task-list__filter-button"
          [class.task-list__filter-button--active]="tasksListService.filter() === 'active'">
          <mat-icon class="task-list__filter-icon">radio_button_unchecked</mat-icon>
          Active
        </button>
        <button mat-button (click)="tasksListService.changeFilter('completed')" class="task-list__filter-button"
          [class.task-list__filter-button--active]="tasksListService.filter() === 'completed'">
          <mat-icon class="task-list__filter-icon">check_circle</mat-icon>
          Completed
        </button>
      </div>
    </div>
  </mat-card>

  <mat-card class="task-list__tasks-section">
    <div class="task-list__tasks-container">
      @if (filteredTodos().length === 0) {
      <div class="task-list__empty-state">
        <mat-icon class="task-list__empty-icon">inbox</mat-icon>
        <p class="task-list__empty-text">No tasks to display</p>
      </div>
      } @else {
      @for(task of filteredTodos(); track task.id) {
      <div class="task-list__task-item" [class.task-list__task-item--completed]="task.isCompleted">
        <mat-checkbox [checked]="task.isCompleted" (change)="tasksListService.toggleTask(task.id)"
          class="task-list__task-checkbox">
        </mat-checkbox>
        <span class="task-list__task-text" [class.task-list__task-text--completed]="task.isCompleted"
          (click)="tasksListService.toggleTask(task.id)">
          {{task.text}}
        </span>
      </div>
      }
      }
    </div>
  </mat-card>
</div>
